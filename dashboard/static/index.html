<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CrowdSec Dash</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%233987e5' d='M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24"><path fill="var(--accent)" d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z"/><path fill="none" stroke="var(--surface)" stroke-width="2" d="m8.5 12 2.5 2.5 4.5-5"/></svg>
      CrowdSec Dash
    </div>
    <nav class="nav" id="nav">
      <a href="#/overview" data-page="overview">Overview</a>
      <a href="#/decisions" data-page="decisions">Decisions <span class="count" id="nav-dec"></span></a>
      <a href="#/alerts" data-page="alerts">Alerts</a>
      <a href="#/traffic" data-page="traffic">Proxy traffic</a>
      <a href="#/firewall" data-page="firewall">Firewall drops</a>
      <a href="#/hosts" data-page="hosts">Hosts &amp; Cloudflare</a>
      <a href="#/status" data-page="status">Status</a>
    </nav>
    <div class="foot">
      Data: CrowdSec LAPI · NPM logs · OPNsense filterlog<br>
      <a href="https://db-ip.com" target="_blank" rel="noopener">IP geolocation by DB-IP</a>
    </div>
  </aside>
  <main>
    <div class="topbar">
      <h1 id="title">Overview</h1>
      <div class="spacer"></div>
      <div class="seg" id="range">
        <button data-r="1h">1h</button><button data-r="6h">6h</button><button data-r="24h">24h</button><button data-r="7d">7d</button><button data-r="30d">30d</button>
      </div>
      <form class="search" id="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search-input" placeholder="Look up an IP…" autocomplete="off">
      </form>
      <button class="icon-btn" id="theme" title="Toggle theme" aria-label="Toggle theme">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    <div class="content" id="view"></div>
  </main>
</div>
<div class="tooltip" id="tip"></div>
<script src="/static/vendor/d3.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
