# crowdsec-dash stack for Unraid (Compose Manager plugin) or any Docker host.
#
#   1. cp .env.example .env   and fill it in
#   2. fix the NPM log path below (NPM_LOGS in .env)
#   3. docker compose up -d --build
#
# Containers:
#   crowdsec-agent  reads NPM's access logs, detects attacks, and reports them to the
#                   LAPI on OPNsense. It does no blocking itself; OPNsense does.
#   crowdsec-dash   the dashboard: reads LAPI + NPM logs + OPNsense syslog.
#   npm-bouncer     OPTIONAL (COMPOSE_PROFILES=npm-bouncer): also blocks banned IPs inside
#                   NPM, which covers Cloudflare-proxied hosts the firewall can't. SETUP.md step 9.

services:
  crowdsec-dash:
    build: ./dashboard
    container_name: crowdsec-dash
    restart: unless-stopped
    labels:
      # Unraid Docker tab: icon, and the "WebUI" menu link (needs BIND_IP set in .env)
      net.unraid.docker.icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/crowdsec.png
      net.unraid.docker.webui: http://${BIND_IP:-}:8088
    ports:
      # BIND_IP = the Unraid LAN address, so nothing on other interfaces (VPN, docker, WAN) can connect
      - "${BIND_IP:-0.0.0.0}:8088:8088"          # web UI
      - "${BIND_IP:-0.0.0.0}:5514:5514/udp"      # OPNsense remote syslog (filterlog) lands here
    environment:
      TZ: ${TZ:-America/New_York}
      PUID: ${PUID:-99}                      # the dashboard runs as this user (99:100 = Unraid nobody:users)
      PGID: ${PGID:-100}
      LAPI_URL: ${LAPI_URL}
      LAPI_MACHINE_ID: ${DASH_MACHINE_ID:-crowdsec-dash}
      LAPI_PASSWORD: ${DASH_MACHINE_PASSWORD}
      NPM_LOG_DIR: /npm-logs
      SYSLOG_PORT: 5514
      SYSLOG_ALLOWED_SOURCES: ${SYSLOG_ALLOWED_SOURCES:-}   # OPNsense's IP; empty = accept anyone
      FW_INTERFACES: ${FW_INTERFACES:-}      # e.g. igb0 to keep WAN drops only
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_FETCH_EVENTS: ${CF_FETCH_EVENTS:-false}
      DASH_USER: ${DASH_USER:-admin}
      DASH_PASSWORD: ${DASH_PASSWORD:-}
      ALLOW_NO_AUTH: ${ALLOW_NO_AUTH:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      ALLOW_WRITE: ${ALLOW_WRITE:-false}
      RETENTION_DAYS: ${RETENTION_DAYS:-14}
    volumes:
      - ./data:/data
      - ${NPM_LOGS}:/npm-logs:ro
      - bouncer-status:/bouncer-status:ro    # npm-bouncer's status, shown on the Status page

  crowdsec-agent:
    # "latest" picks up new CrowdSec releases (incl. security fixes) whenever the image is pulled:
    # `docker compose pull && docker compose up -d`, or Update Stack in Compose Manager. It does not
    # update on its own. Check the Status page after an update; if a release ever breaks the agent,
    # pin the last good one here (tested with v1.8.1).
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec-agent
    restart: unless-stopped
    labels:
      net.unraid.docker.icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/crowdsec.png
    environment:
      TZ: ${TZ:-America/New_York}
      DISABLE_LOCAL_API: "true"            # agent only - the LAPI lives on OPNsense
      LOCAL_API_URL: ${LAPI_URL}
      AGENT_USERNAME: ${AGENT_MACHINE_ID:-unraid-npm}
      AGENT_PASSWORD: ${AGENT_MACHINE_PASSWORD}
      COLLECTIONS: >-
        crowdsecurity/nginx-proxy-manager
        crowdsecurity/base-http-scenarios
        crowdsecurity/http-cve
    volumes:
      - ./crowdsec/acquis.d:/etc/crowdsec/acquis.d:ro
      # custom login brute-force scenarios (one file each: mounting the whole folder would hide the hub's)
      - ./crowdsec/scenarios/jellyfin-npm-bf.yaml:/etc/crowdsec/scenarios/jellyfin-npm-bf.yaml:ro
      - ./crowdsec/scenarios/komga-npm-bf.yaml:/etc/crowdsec/scenarios/komga-npm-bf.yaml:ro
      - ./crowdsec/scenarios/seerr-npm-bf.yaml:/etc/crowdsec/scenarios/seerr-npm-bf.yaml:ro
      - ./crowdsec/scenarios/audiobookshelf-npm-bf.yaml:/etc/crowdsec/scenarios/audiobookshelf-npm-bf.yaml:ro
      - ./crowdsec/parsers/cloudflare-whitelist.yaml:/etc/crowdsec/parsers/s02-enrich/cloudflare-whitelist.yaml:ro
      - crowdsec-agent-data:/var/lib/crowdsec/data
      - crowdsec-agent-config:/etc/crowdsec
      - ${NPM_LOGS}:/var/log/npm:ro

  # Blocks banned IPs in Nginx Proxy Manager (403), using NPM's own custom-config hooks:
  # works with the stock jc21 image. Off unless COMPOSE_PROFILES=npm-bouncer is set in .env.
  npm-bouncer:
    build: ./npm-bouncer
    container_name: crowdsec-npm-bouncer
    profiles: ["npm-bouncer"]
    restart: unless-stopped
    labels:
      net.unraid.docker.icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/crowdsec.png
    # Share NPM's process list so we can tell its nginx to reload (no Docker socket needed).
    # Must be NPM's container name as shown by `docker ps`.
    # If NPM restarts (backup, update) this container stops with it: install scripts/npm-bouncer-watchdog.sh.
    pid: "container:${NPM_CONTAINER:-Nginx-Proxy-Manager-Official}"
    # Root, but with only these capabilities. Having fewer capabilities than NPM's processes
    # also means the kernel won't let this container read NPM's memory, environment or files.
    cap_drop: [ALL]
    cap_add: [KILL, DAC_OVERRIDE]   # signal nginx; write into NPM's custom-config folder
    security_opt: ["no-new-privileges:true"]
    read_only: true
    environment:
      TZ: ${TZ:-America/New_York}
      LAPI_URL: ${LAPI_URL}
      BOUNCER_API_KEY: ${NPM_BOUNCER_API_KEY:-}      # cscli bouncers add npm-bouncer (on OPNsense)
      INCLUDE_ORIGINS: ${NPM_BOUNCER_ORIGINS:-crowdsec,cscli}   # "all" adds community blocklists
      NPM_CUSTOM_DIR: /npm-custom
      NGINX_CUSTOM_PATH: /data/nginx/custom          # the same folder as NPM itself sees it
    volumes:
      - ${NPM_DATA:-./npm-data-not-set}/nginx/custom:/npm-custom
      - bouncer-status:/status

volumes:
  crowdsec-agent-data:
  crowdsec-agent-config:
  bouncer-status:
